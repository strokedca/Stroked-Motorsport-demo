global
    maxconn 128
defaults
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s
resolvers localdocker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold nx 1s
listen api
    bind :8000
    server api supabase_kong_StrokedRecoverySite:8000 resolvers localdocker init-addr none
listen database
    bind :5432
    server database supabase_db_StrokedRecoverySite:5432 resolvers localdocker init-addr none
listen mail
    bind :8025
    server mail supabase_inbucket_StrokedRecoverySite:8025 resolvers localdocker init-addr none
listen studio
    bind :3000
    server studio supabase_studio_StrokedRecoverySite:3000 resolvers localdocker init-addr none
