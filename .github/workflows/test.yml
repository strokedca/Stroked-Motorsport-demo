name: Test Stroked candidate
on:
  push:
    branches: [v5.5-testing, payments-support-testing, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Recheck the lockfile for newly disclosed advisories even without a code change.
    - cron: '17 12 * * 1'
permissions:
  contents: read
jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check locked dependencies for high or critical advisories
        run: npm audit --include=dev --audit-level=high
      - run: npm test
      - run: npm run build:production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v55-production-candidate
          path: dist/
