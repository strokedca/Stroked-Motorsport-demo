name: Test Stroked candidate
on:
  push:
    branches: [v5.5-testing, main]
  pull_request:
jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:production
      - uses: actions/upload-artifact@v4
        with:
          name: v55-production-candidate
          path: dist/
