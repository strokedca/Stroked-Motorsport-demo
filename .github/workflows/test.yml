name: Test Stroked candidate
on:
  push:
    branches: [v5.5-testing, payments-support-testing, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Recheck the lockfile for newly disclosed advisories even without a code change.
    - cron: '17 12 * * 1'
permissions:
  contents: read
jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check locked dependencies for high or critical advisories
        run: npm audit --include=dev --audit-level=high
      - run: npm test
      - run: npm run build:production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v55-production-candidate
          path: dist/
